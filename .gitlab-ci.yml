#     ARGO_HOST: $argohost_stg
#     ARGO_USER: $argouser_stg
#     ARGO_PASS: $argopass_stg
  
argo-refresh-production:
  extends: .refresh
  variables:
    ARGO_HOST: $argohost
    ARGO_USER: $argouser
    ARGO_PASS: $argopass

