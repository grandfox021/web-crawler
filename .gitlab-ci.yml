workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

variables:
  MONO_REPO: "api"          
  MICRO_SERVICE: "bale-scraper-api"          
  YAMLS_REPO: "k8s-yaml"
  SECRET_NAME: "services"
  REPOSITORY_YAML: "git@gitlab.local:kandoo/bale-scraper/backend/k8s-yaml.git"          #Change_Me  (k8s-yaml project's ssh url)
  REPOSITORY_SSH_URL: "git@${CI_SERVER_HOST}:${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}.git"
  TARGET_REGISTRY_PATH: kandoo/bale-scraper/backend/k8s-yaml                             #Change_Me
  TARGET_REPO: https://oauth2:${TARGET_TOKEN}@${TARGET_DOMAIN}/${TARGET_REGISTRY_PATH}.git
  TARGET_DOMAIN: sep.gitlab.local:8085
  tag:
    value: "patch"
    options:
      - "patch"
      - "minor"
      - "major"
    description: "Select the release version type for production: tag =(major.minor.patch)"
  # TARGET_REGISTRY:
  # TARGET_TOKEN:
  # GITLAB_TOKEN:
  # ALLOWED_USERS:
  
stages:
  - build_update_manifest
  - push_manifest
  - argo_refresh
  # - tagging
  # - approve
  # - build_production
  # - push_production

      
##################################### build_update_manifest #####################################

.build:
  stage: build_update_manifest
  tags:
    - runner1                    #Change_Me_Production  (change to runner1)
  variables:
    CONTAINER_PORT: "8000"        #Change_Me  (service port : 80 or 8000)
    REPLICAS: ""
    # STAGE_NAME: ""
    DOCKERFILE_NAME: ""
    GIT_DEPTH: "0"
    # GIT_STRATEGY: clone
  before_script:
  #  - cd project_directory       #Change_Me  (if exist folder for code files)
    - git config --global user.email "runner@gmail.com"
    - git config --global user.name "shell-runner"
    - echo $GITLAB_TOKEN
    - echo $CI_SERVER_HOST
    - echo $CI_PROJECT_PATH
    - echo http://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    - git remote set-url origin http://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    - git fetch --prune --prune-tags
    - git fetch --tags
    - export APP_VERSION=$(git tag -l "v*" --sort=-v:refname | head -n 1)
    - if [ -z "$APP_VERSION" ]; then export APP_VERSION="v1.0.0"; fi
    # - export APP_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
    - export IMAGE_NAME=$CI_REGISTRY_IMAGE/microservice/$MICRO_SERVICE
    - export IMAGE_TAG=$APP_VERSION-$CI_COMMIT_SHORT_SHA
    - echo "PREVIOUS_TAG=$APP_VERSION" >> build.env
    - echo "PREVIOUS_STAGE_TAG=$IMAGE_TAG" >> build.env
    - echo "PREVIOUS_IMAGE=$IMAGE_NAME" >> build.env
    - echo "Current base tag is $APP_VERSION"
  # script:
    # -
  artifacts:
    paths:
      - deployment-$MICRO_SERVICE.yaml
    expire_in: 1 hour
    reports:
      dotenv: build.env
  only:
    - main

build-image:
  extends: .build
  stage: build_update_manifest
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    # - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -f ${DOCKERFILE_NAME:-Dockerfile} .
    - docker push $IMAGE_NAME:$IMAGE_TAG
  artifacts:
    reports:
      dotenv: build.env
  
# update-staging:
#   extends: .build
#   variables:
#     REPLICAS: "1"
#     STAGE_NAME: "staging"
#     DOCKERFILE_NAME: "Dockerfile"   #Change_Me  (if exist Dockerfile.stage)
#   script:
#     - envsubst < kubernetes/deployment.yaml > deployment-$MICRO_SERVICE.yaml
#   needs: ["build-image"]
  
update-production:
  extends: .build
  variables:
    REPLICAS: "1"
    STAGE_NAME: "production"
    DOCKERFILE_NAME: "Dockerfile"   #Change_Me  (if exist Dockerfile.stage)
  script:
    - envsubst < kubernetes/deployment.yaml > deployment-$MICRO_SERVICE.yaml
  needs: ["build-image"]
  
######################################## push manifest ##########################################

.push:
  stage: push_manifest
  tags:
    - runner1                      #Change_Me_Production  (change to runner1)
  variables:
    BRANCH: ""
  script:
    - cd ..
    - rm -rf $YAMLS_REPO
    - git clone -b $BRANCH $REPOSITORY_YAML
    - cd $YAMLS_REPO
    - mv -t . ../$MONO_REPO/deployment*
    # - git config --global user.email "runner@gmail.com"
    # - git config --global user.name "shell-runner"
    # - git add .
    # - git commit -m "update yaml files"
    # - git push
    # - cd ..
    # - rm -rf $YAMLS_REPO
    - git add .
    - |
      if ! git diff --cached --quiet; then
        git -c user.email="runner@gmail.com" \
            -c user.name="shell-runner" \
            commit -m "update yaml files"

        git push origin "$BRANCH"
      else
        echo "No changes to commit"
      fi

    - cd ..
    - rm -rf "$YAMLS_REPO"
  only:
    - main




# push-staging:
#   extends: .push
#   variables:
#     BRANCH: "sepah-stage"   #staging
  
push-production:
  extends: .push
  variables:
    BRANCH: "main"

########################################## refresh argocd ##########################################

.refresh:
  stage: argo_refresh
  tags:
    - runner1                      
  variables:
    ARGO_HOST: ""
    ARGO_USER: ""
    ARGO_PASS: ""
  script:
    - argocd login $ARGO_HOST --insecure --username $ARGO_USER --password $ARGO_PASS   
    - argocd app get $MICRO_SERVICE --refresh
    - sleep 10
    - echo "Your Application Deployed Successfully."
  only:
    - main

# argo-refresh-staging:
